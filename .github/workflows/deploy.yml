# main に push したら、テストを通したうえで GitHub Pages に公開する。
# Pages の URL は https://<ユーザー名>.github.io/<リポジトリ名>/ なので、base をリポジトリ名に合わせてビルドする。
# 初回だけ、リポジトリの Settings → Pages で Source を「GitHub Actions」にしておく。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 公開の権限（pages・id-token）は deploy だけに付ける。build は依存パッケージのスクリプトを動かすので、読み取りだけにする
permissions:
  contents: read

# 公開は 1 本ずつ。走っている公開は途中で止めない
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # npm run build（型チェック + vite build）の vite build に --base を渡す
      - run: npm run build -- --base "/${{ github.event.repository.name }}/"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
