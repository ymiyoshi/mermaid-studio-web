# PR ごとに型チェック・テスト・ビルド・E2E を通す（Renovate の更新 PR もここで確かめる）。
# E2E はインストール済みの Chrome で動かす（playwright.config.ts の channel: 'chrome'）。ubuntu-latest には Chrome が入っている。
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
